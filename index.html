<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Cookie Clicker</title>
 
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
    <h1>🍪 Cookie Clicker</h1>
 
    <div id="cookieCount">0 cookies</div>
 
    <div id="cookiesPerSecond">
        0 cookies per second
</div>
 
    <button id="cookie"><img src="Monster.png" alt="Cookie"></img></button>
 
 
    <div class="shop">
 
        <h2>Shop</h2>
 
        <button id="cursorButton">
            🖱️ Buy Cursor - 15 cookies
</button>
 
        <p id="cursorInfo">
            Cursors: 0
</p>
 
 
        <button id="grandmaButton">
            👵 Buy Grandma - 100 cookies
</button>
 
        <p id="grandmaInfo">
            Grandmas: 0
</p>
 
    </div>
 
 
    <button class="save-button" id="saveButton">
        💾 Save Game
</button>
 
    <button class="reset-button" id="resetButton">
        🔄 Reset Game
</button>
 
 
    <script src="game.js"></script>
 
</body>
</html>
